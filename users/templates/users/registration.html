{% extends "core/base.html" %}

{% block title%} {{ title }} {% endblock %}

{% block content %} 
    <div class="w-75 d-flex justify-content-center flex-column align-items-center m-auto p-5">
        <h1>{{ title }}</h1>
        <form method='POST'>
            {% csrf_token %}
            {{ form.as_p }}
            <button class="mt-2 btn btn-warning" type="submit">Реєстрація</button>
        </form>
    </div>
{% endblock %}
