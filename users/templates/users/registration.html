{% extends "core/base.html" %}

{% block title%} {{ title }} {% endblock %}

{% block content %} 
    <div class="w-100 d-flex justify-content-center flex-column align-items-center m-auto p-5">
        <h1 class="mb-3 fs-1 text-warning-emphasis">{{ title }}</h1>
        <form class="w-50 form-register" method='POST'>
            {% csrf_token %}
            {{ form.as_p }}
            <button class="mt-2 btn btn-warning" type="submit">Реєстрація</button>
            <hr>
            <p>Зареєстровані? <a href="{% url 'user' %}">Вхід в особистий профіль</a> </p>
        </form>
    </div>
{% endblock %}
