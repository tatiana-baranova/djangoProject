{% extends "core/base.html" %}

{% block title%} {{ title }} {% endblock %}

{% block content %} 
<a href="{% url 'news_add'%}" class="move-left btn m-2">Додати статтю</a>
    {% for post in news %}
    <div class="w-50 d-flex flex-row justify-content-start alert alert-light">
        <img class="card-author-md rounded-5 object-fit-cover m-2" src="{{post.author.profile.img.url}}" alt="{{post.author.username}}">
        

        <div class="d-flex flex-column news-user-data">
            <h2 class="fs-3">{{post.title}}</h2>
            <p>{{post.text}}</p>
            <div>
                <span class="text-muted">Опубліковано: {{post.date|date:'d E Y року в H:i'}}</span>
                <p>Автор: <mark>{{ post.author }} </mark></p>
                <a href="{% url 'news_detail' post.id %}" class="mt-2 btn btn-outline-warning">Детально</a>
            </div>
        </div>
    </div>
    {% endfor %}


{% endblock %}
