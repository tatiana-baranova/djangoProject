{% extends "core/base.html" %}

{% block title%} {{ title }} {% endblock %}

{% block content %} 
    <div class="w-100 d-flex justify-content-center flex-column align-items-center m-auto p-5">
        <h1 class="mb-3 fs-1 text-warning-emphasis">Додавання статті</h1>
        <a href="{% url 'articles' %}" class="move-left-but btn m-2">
            ← Назад до статей
        </a>
        <form class="w-50 form-register auth" method='POST'>
            {% csrf_token %}
            {{ form.as_p }}
            <button class="mt-2 btn btn-warning" type="submit">{{btn_title}}</button>
        </form>
        
    </div>
{% endblock %}
